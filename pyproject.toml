[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-upload"
dynamic = ["version"]
description = "File uploads for MCP servers using short-lived upload tickets."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Imaad Zaffar Khan", email = "kimaad71@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "file-upload", "upload", "starlette", "asgi"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
# starlette is the request and routing surface the core handler is written against.
# httpx streams the upload body onward to the destination backend.
# streaming-form-data parses multipart incrementally, which is what lets the server
# forward bytes without buffering the file in memory or on disk. It ships compiled
# wheels for CPython 3.10 to 3.13 as of 2.1.0, which is why the CI matrix stops at 3.13.
dependencies = [
  "starlette>=1.0",
  "httpx>=0.28",
  "streaming-form-data>=2.0",
  # For TypedDict on Python 3.11, where pydantic (used by the MCP SDK for tool output
  # schemas) does not accept the standard library one.
  "typing-extensions>=4.5; python_version < '3.12'",
]

[project.optional-dependencies]
# Each adapter is a thin registration of the same core handler on a server instance.
# The two extras are mutually exclusive: fastmcp 3.x pins the official SDK to mcp<2,
# while the mcp extra targets SDK 2.x. Install one or the other, never both. That is
# also why neither framework is in the dev extra and why CI runs one lane per framework.
# Upper bounds are deliberate: both frameworks shipped or announced a breaking major
# release within weeks of this project starting.
mcp = ["mcp>=2.1,<3"]
fastmcp = ["fastmcp>=3.4,<5"]
# Optional ticket store for servers running behind a load balancer. Imported only
# through mcp_upload.redis_store, so the package root never needs it.
redis = ["redis>=5.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  # The socket-level tests run the gateway and a backend on loopback.
  "uvicorn>=0.30",
  # Run in CI on every push: known-vulnerability audit of the locked dependencies,
  # and a static security scan of the source.
  "pip-audit>=2.7",
  "bandit>=1.7",
  # The Redis store's tests run against fakeredis, which needs the lua extra to
  # execute the redemption script. CI also runs them against a real Redis.
  "redis>=5.0",
  "fakeredis[lua]>=2.23",
]

[tool.uv]
# The mcp and fastmcp extras cannot be installed together (fastmcp 3.x pins mcp<2).
# Declaring the conflict lets uv produce one lockfile that covers both lanes.
conflicts = [[{ extra = "mcp" }, { extra = "fastmcp" }]]
# The build backend is not covered by the lockfile. Pinning it here means `uv build`
# in the release workflow uses a known version rather than the newest on the day.
build-constraint-dependencies = ["hatchling==1.32.0"]

[project.urls]
Repository = "https://github.com/imaadkhan-tz/mcp-upload"
Issues = "https://github.com/imaadkhan-tz/mcp-upload/issues"

[tool.hatch.version]
path = "src/mcp_upload/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_upload"]

# An explicit allowlist. The build backend consults .gitignore but nothing else, so
# anything present in the working tree that is not listed here would otherwise be
# shipped in the source distribution.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "typings", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.11"
# streaming-form-data ships no type information. A minimal stub lives in typings/ so
# the parser target can be subclassed under strict mode without loosening it.
mypy_path = "typings"

# The adapter tests import whichever framework is installed and skip the other. Each
# lane is missing one of them, and that is expected rather than an error.
[[tool.mypy.overrides]]
module = [
  "fastmcp",
  "fastmcp.*",
  "mcp.client.client",
  "mcp.server.mcpserver",
  "mcp.server.auth.*",
  "mcp_types",
]
ignore_missing_imports = true

# The extension adapter subclasses the SDK's Extension base class, which exists only in
# mcp 2.x. The FastMCP lane pins mcp<2, so in that lane the base class is missing and
# strict mode would refuse to subclass the resulting Any. The module is six lines of
# declaration with no logic, so loosening exactly it costs nothing.
[[tool.mypy.overrides]]
module = ["mcp.server.extension", "mcp.shared.extension", "mcp_upload.adapters.mcp_extension"]
ignore_missing_imports = true
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
