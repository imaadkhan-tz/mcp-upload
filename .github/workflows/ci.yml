name: ci

on:
  push:
    branches: [main]
  pull_request:

# The token this workflow gets can read the repository and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 joins the matrix once streaming-form-data publishes a cp314 wheel.
        python-version: ["3.11", "3.12", "3.13"]
        # One lane per server framework. fastmcp 3.x pins mcp<2, so the two extras
        # cannot be installed together. Core tests run in both lanes.
        framework: ["mcp", "fastmcp"]
    steps:
      # Every action is pinned to a commit, not a tag. A tag can be moved to different
      # code by whoever controls the action's repository; a commit cannot. Dependabot
      # proposes bumps and keeps the version comment in sync.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from the lockfile
        # --locked fails if uv.lock is out of date with pyproject.toml, so a
        # dependency change cannot land without its resolution being committed.
        run: uv sync --locked --extra dev --extra ${{ matrix.framework }}
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --locked --no-emit-project --extra dev --extra ${{ matrix.framework }} --format requirements-txt > requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --no-deps --progress-spinner off
      - name: Static security scan
        run: uv run bandit -q -r src examples
