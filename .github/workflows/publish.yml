name: publish

# Builds on a version tag and publishes to PyPI through trusted publishing, so no
# token is stored in the repository. The PyPI project lists this repository, this
# workflow file, and the "pypi" environment as its trusted publisher.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # The repository is mirrored to a second account. Only the account registered
    # with PyPI as the trusted publisher may build and publish.
    if: github.repository == 'imaad786/mcp-upload'
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits, see ci.yml for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
      - name: Build
        # The build backend version is pinned in pyproject.toml under [tool.uv], so
        # the artifact does not depend on whatever hatchling is newest on the day.
        run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    if: github.repository == 'imaad786/mcp-upload'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
