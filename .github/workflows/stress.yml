# Nightly end-to-end stress and fuzz run.
#
# This runs the harness in stress/: a separate gateway and backend process per scenario
# over real sockets, a real Redis, a randomized multipart fuzz and live SEP-2631 flows.
# It takes minutes of sustained load, which is too slow and too noisy for every push, so
# it runs once a day and on demand. stress/check.py fails the job only on invariants that
# hold on any machine (exact bytes, one winner per ticket and claim, refusals, leftover
# files, no memory kill), never on throughput, latency or memory figures.
name: stress

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# The token this workflow gets can read the repository and nothing else.
permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throughput and slowloris are left out: they measure the machine, and slowloris
      # alone takes 90 s of wall time. Everything here has timing-free invariants.
      SCENARIOS: >-
        header_bomb,header_bomb_under_load,epilogue_valid,epilogue_flood,burst_over_cap,policy_edges,digest_integrity,owner_isolation,claim_race,error_details,digest_format,filename_hygiene,chaos,store_backed_uploads,redis_two_replicas,sqlite_two_processes,on_complete_hook,sink_integrity,sink_mixed_failures,raw_uploads,bearer_auth,bearer_resource,headless_flow,destination_choice

    steps:
      # Pinned to commits like ci.yml; Dependabot proposes bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - name: Install from the lockfile
        run: uv sync --locked --extra dev --extra mcp
      - name: End-to-end scenarios
        run: |
          ulimit -n 10240
          mkdir -p stress-results
          uv run --no-sync python stress/run.py --src src \
            --only "$SCENARIOS" \
            --redis-url redis://localhost:6379/0 \
            --out stress-results/run.json
      - name: Check scenario invariants
        run: uv run --no-sync python stress/check.py stress-results/run.json --require "$SCENARIOS"
      - name: Multipart fuzz
        if: ${{ !cancelled() }}
        run: |
          ulimit -n 10240
          mkdir -p stress-results
          uv run --no-sync python stress/fuzz.py --src src --n 3000 > stress-results/fuzz.txt
          uv run --no-sync python stress/check.py --fuzz stress-results/fuzz.txt
      - name: SEP-2631 flows
        if: ${{ !cancelled() }}
        run: |
          ulimit -n 10240
          mkdir -p stress-results
          # sep_flow.py exits 1 when a flow fails; check.py reports which one.
          uv run --no-sync python stress/sep_flow.py > stress-results/sep_flow.json || true
          uv run --no-sync python stress/check.py --sep-flow stress-results/sep_flow.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: stress-results
          path: stress-results/
          retention-days: 30
          if-no-files-found: warn
